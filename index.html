<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Ledger — Dungeon! Treasure Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <h1 class="site-title">The Ledger</h1>
  <p class="site-sub">Dungeon! treasure tracker</p>
</header>

<main id="app">

  <!-- SETUP SCREEN -->
  <section id="setup-screen" class="screen">
    <div class="panel">
      <h2 class="panel-title">Assemble the Party</h2>
      <p class="panel-hint">Add one row per adventurer you're keeping score for. Everyone else can open this same page on their own device and track themselves.</p>

      <div id="roster-rows" class="roster-rows"></div>

      <button id="add-row-btn" type="button" class="btn btn-secondary btn-block">+ Add Another Adventurer</button>

      <button id="start-btn" type="button" class="btn btn-primary btn-block btn-large">Begin the Delve</button>
      <p id="setup-error" class="form-error" hidden></p>
    </div>
  </section>

  <!-- GAME SCREEN -->
  <section id="game-screen" class="screen" hidden>
    <div class="toolbar">
      <button id="edit-roster-btn" type="button" class="btn btn-secondary">Edit Roster</button>
      <button id="reset-scores-btn" type="button" class="btn btn-attention">Reset Treasure</button>
      <button id="new-game-btn" type="button" class="btn btn-attention">New Game</button>
    </div>

    <div id="cards-grid" class="cards-grid"></div>
  </section>

</main>

<footer class="site-footer">
  <p>Progress saves automatically on this device.</p>
</footer>

<template id="roster-row-template">
  <div class="roster-row" data-row>
    <input type="text" class="row-name" placeholder="Adventurer name" maxlength="24">
    <select class="row-class">
      <option value="rogue" data-goal="10000">Rogue — 10,000 gp</option>
      <option value="cleric" data-goal="10000">Cleric — 10,000 gp</option>
      <option value="fighter" data-goal="20000">Fighter — 20,000 gp</option>
      <option value="wizard" data-goal="30000">Wizard — 30,000 gp</option>
      <option value="custom" data-goal="">Custom goal…</option>
    </select>
    <input type="number" class="row-goal" min="1" step="1" placeholder="Goal (gp)" inputmode="numeric">
    <button type="button" class="row-remove" aria-label="Remove adventurer" title="Remove">✕</button>
  </div>
</template>

<template id="card-template">
  <article class="card" data-card>
    <div class="card-top">
      <div class="card-id">
        <h3 class="card-name" data-name></h3>
        <span class="card-class" data-class></span>
      </div>
    </div>

    <div class="treasure-readout">
      <span class="treasure-amount" data-amount>0</span>
      <span class="treasure-unit">gp</span>
    </div>

    <div class="progress-track">
      <div class="progress-fill" data-progress></div>
    </div>
    <div class="progress-label">
      <span data-progress-text>0 / 0 gp</span>
      <span class="escaped-badge" data-escaped-badge hidden>ESCAPED THE DUNGEON!</span>
    </div>

    <div class="amount-controls">
      <label class="amount-label" data-amount-label-for>
        Amount
        <input type="number" class="amount-input" data-amount-input min="0" step="1" inputmode="numeric" value="100">
      </label>
      <div class="amount-buttons">
        <button type="button" class="btn btn-secondary btn-square" data-subtract-btn aria-label="Subtract treasure">−</button>
        <button type="button" class="btn btn-primary btn-square" data-add-btn aria-label="Add treasure">+</button>
      </div>
    </div>

    <div class="chip-row" data-chip-row>
      <button type="button" class="chip" data-chip="250">250</button>
      <button type="button" class="chip" data-chip="500">500</button>
      <button type="button" class="chip" data-chip="750">750</button>
      <button type="button" class="chip" data-chip="1000">1,000</button>
      <button type="button" class="chip" data-chip="1250">1,250</button>
      <button type="button" class="chip" data-chip="1500">1,500</button>
      <button type="button" class="chip" data-chip="2000">2,000</button>
      <button type="button" class="chip" data-chip="2500">2,500</button>
      <button type="button" class="chip" data-chip="3000">3,000</button>
      <button type="button" class="chip" data-chip="3500">3,500</button>
      <button type="button" class="chip" data-chip="4000">4,000</button>
      <button type="button" class="chip" data-chip="5000">5,000</button>
      <button type="button" class="chip" data-chip="6000">6,000</button>
      <button type="button" class="chip" data-chip="7500">7,500</button>
      <button type="button" class="chip" data-chip="10000">10,000</button>
    </div>

    <div class="card-footer">
      <button type="button" class="btn btn-tertiary btn-small" data-edit-goal-btn>Edit goal</button>
      <button type="button" class="btn btn-tertiary btn-small attention-text" data-remove-card-btn>Remove</button>
    </div>
  </article>
</template>

<script src="script.js"></script>
</body>
</html>
